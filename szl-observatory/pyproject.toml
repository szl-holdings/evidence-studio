[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "szl-observatory"
version = "0.1.0"
description = "Evidence-first analytics, provenance, and monetization telemetry for the SZL estate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
szl-observatory = "szl_observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/szl_observatory"]
force-include = { "frontend" = "szl_observatory/frontend" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
